[project]
name = "investigation-engine"
version = "0.1.0"
description = "Evidence-first investigation engine over large document collections (Upgaming stage 2)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.3.0",
    "langfuse>=5.0.4",
    "numpy>=2.5.4",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "reportlab>=5.1.0",
    "sentence-transformers>=6.2.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "pytest>=9.1.1",
]

[tool.ruff]
extend-exclude = ["data/corpus", "data/raw"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]          # long lines are allowed; everything else is enforced in CI
